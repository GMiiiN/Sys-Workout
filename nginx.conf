server {
    listen 80;
    server_name _;

    root /var/www/workout;
    index index.html;

    # 화면(HTML)은 nginx가 직접 제공 → 웹 서버 계층
    location / {
        try_files $uri $uri/ =404;
    }

    # /api/ 요청은 Node.js로 전달 → WAS 계층
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}